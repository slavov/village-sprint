<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1F4A3C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sprint">
<title>Log — Village Sprint</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Archivo:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <div class="header-row">
    <div>
      <div class="eyebrow">Village Sprint</div>
      <h1>Log</h1>
    </div>
    <div class="hstats">
      <div><div class="num" id="probCount">0</div><div class="lbl">logged</div></div>
    </div>
  </div>

  <div class="card">
    <h2>Log something solved</h2>
    <div class="tabrow" id="trackTabs"></div>
    <div class="formgrid">
      <div class="full">
        <label class="f" for="pName">Name</label>
        <input type="text" id="pName" placeholder="e.g. Rotting Oranges">
      </div>
      <div class="full">
        <label class="f" for="pUrl">Link</label>
        <input type="url" id="pUrl" placeholder="https://...">
      </div>
      <div>
        <label class="f" for="pTopic">Topic</label>
        <select id="pTopic"></select>
      </div>
      <div>
        <label class="f" for="pDiff">Difficulty</label>
        <select id="pDiff">
          <option>Easy</option>
          <option selected>Medium</option>
          <option>Hard</option>
        </select>
      </div>
      <div class="full">
        <label class="f" for="pNotes">Notes / pitfall to remember</label>
        <textarea id="pNotes" placeholder="e.g. forgot the visited set → infinite loop"></textarea>
      </div>
    </div>
    <button class="save" id="pAdd">Add to log</button>
    <div class="saved-flash" id="pFlash"></div>
    <div class="thint" id="tickHint">Adding this also ticks today's matching checklist box.</div>
  </div>

  <div class="card">
    <h2>Progress <span class="meta">all-time</span></h2>
    <div class="statgrid" id="pillarStats"></div>
  </div>

  <div class="card">
    <h2>Logged <span class="meta" id="listMeta"></span></h2>
    <div class="tabrow" id="filterTabs"></div>
    <div id="probList"><div class="empty">Nothing logged yet.</div></div>
  </div>

</div>

<nav class="nav">
  <a href="index.html" data-page="today"><span class="ico">♞</span>Today</a>
  <a href="problems.html" data-page="problems"><span class="ico">⌗</span>Log</a>
  <a href="review.html" data-page="review"><span class="ico">↻</span>Review</a>
</nav>

<script src="js/store.js"></script>
<script>
(function () {
  VS.load();
  VS.markNav('problems');
  const S = VS.state();

  let formTrack = VS.TRACK_DEFS[0].id;
  let filterTrack = 'All';

  // form track tabs
  const trackTabs = document.getElementById('trackTabs');
  function renderFormTabs() {
    trackTabs.innerHTML = '';
    VS.TRACK_DEFS.forEach(t => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab chip-' + t.chip + (t.id === formTrack ? ' on' : '');
      b.textContent = t.short;
      b.onclick = () => { formTrack = t.id; renderFormTabs(); renderTopics(); };
      trackTabs.appendChild(b);
    });
  }
  function renderTopics() {
    const sel = document.getElementById('pTopic');
    sel.innerHTML = '';
    VS.trackDef(formTrack).topics.forEach(t => {
      const o = document.createElement('option');
      o.value = t; o.textContent = t;
      sel.appendChild(o);
    });
    document.getElementById('tickHint').textContent =
      'Adding this also ticks today’s "' + VS.trackDef(formTrack).id + '" checklist box.';
  }

  // list filter tabs
  const filterTabs = document.getElementById('filterTabs');
  function renderFilterTabs() {
    filterTabs.innerHTML = '';
    ['All'].concat(VS.TRACK_DEFS.map(t => t.id)).forEach(id => {
      const def = VS.TRACK_DEFS.find(t => t.id === id);
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab' + (def ? ' chip-' + def.chip : '') + (id === filterTrack ? ' on' : '');
      b.textContent = def ? def.short : 'All';
      b.onclick = () => { filterTrack = id; render(); };
      filterTabs.appendChild(b);
    });
  }

  function render() {
    const all = (S.problems || []);
    document.getElementById('probCount').textContent = all.length;

    // pillar stats
    const stats = VS.TRACK_DEFS.map(t => [all.filter(p => p.track === t.id).length, t.short]);
    document.getElementById('pillarStats').innerHTML = stats.map(c =>
      '<div class="stat"><div class="v">' + c[0] + '</div><div class="l">' + c[1] + '</div></div>').join('');

    const probs = all.filter(p => filterTrack === 'All' || p.track === filterTrack)
      .slice().sort((a, b) => (a.date < b.date ? 1 : -1));
    document.getElementById('listMeta').textContent = probs.length + ' of ' + all.length;
    const list = document.getElementById('probList');
    if (probs.length === 0) {
      list.innerHTML = '<div class="empty">Nothing logged yet.</div>';
    } else {
      list.innerHTML = '';
      probs.forEach(p => {
        const def = VS.trackDef(p.track);
        const el = document.createElement('div');
        el.className = 'prob';
        const nameHtml = p.url
          ? '<a href="' + VS.esc(p.url) + '" target="_blank" rel="noopener">' + VS.esc(p.name) + '</a>'
          : VS.esc(p.name);
        el.innerHTML =
          '<div class="top"><span class="nm">' + nameHtml + '</span>' +
          '<span class="chip chip-' + def.chip + '">' + VS.esc(p.track) + '</span>' +
          '<span class="chip">' + VS.esc(p.topic) + '</span>' +
          '<span class="chip gold">' + VS.esc(p.diff) + '</span></div>' +
          '<div class="sub">' + VS.fmtDate(p.date) +
          (p.lastReview ? ' · re-solved ' + VS.fmtDate(p.lastReview) : '') + '</div>' +
          (p.notes ? '<div class="notes">' + VS.esc(p.notes) + '</div>' : '');
        const acts = document.createElement('div');
        acts.className = 'acts';
        const q = document.createElement('button');
        q.className = 'mini'; q.textContent = 'Queue re-solve +2d';
        q.onclick = () => {
          const d = new Date(); d.setDate(d.getDate() + 2);
          S.resolve = S.resolve || [];
          S.resolve.push({ n: p.name, due: VS.iso(d) });
          VS.save();
          q.textContent = 'Queued ✓'; q.disabled = true;
        };
        const del = document.createElement('button');
        del.className = 'x'; del.textContent = '×';
        del.setAttribute('aria-label', 'delete ' + p.name);
        del.onclick = () => {
          if (!confirm('Delete "' + p.name + '" from the log?')) return;
          S.problems = S.problems.filter(x => x.id !== p.id);
          VS.save(); render();
        };
        acts.appendChild(q); acts.appendChild(del);
        el.appendChild(acts);
        list.appendChild(el);
      });
    }
  }

  document.getElementById('pAdd').addEventListener('click', () => {
    const name = document.getElementById('pName').value.trim();
    if (!name) { document.getElementById('pName').focus(); return; }
    const url = document.getElementById('pUrl').value.trim();
    if (url && !/^https?:\/\//i.test(url)) {
      document.getElementById('pFlash').textContent = 'Link must start with http(s)://';
      return;
    }
    const p = {
      id: 'p' + Date.now(),
      name: name, url: url, track: formTrack, topic: document.getElementById('pTopic').value,
      diff: document.getElementById('pDiff').value,
      notes: document.getElementById('pNotes').value.trim(),
      date: VS.todayIso(), lastReview: null
    };
    S.problems = S.problems || [];
    S.problems.push(p);

    // tick today's matching checklist box
    const k = VS.todayIso();
    const cur = VS.dayState(k);
    cur[VS.trackDef(formTrack).check] = true;
    if (formTrack === 'Algorithm' && !cur.problem) cur.problem = name;
    S.days[k] = cur;

    VS.save();
    document.getElementById('pName').value = '';
    document.getElementById('pUrl').value = '';
    document.getElementById('pNotes').value = '';
    document.getElementById('pFlash').textContent = 'Logged ✓ — today’s "' + formTrack + '" box ticked';
    setTimeout(() => { document.getElementById('pFlash').textContent = ''; }, 3000);
    render();
  });

  renderFormTabs();
  renderTopics();
  renderFilterTabs();
  render();
})();
</script>
</body>
</html>
